name: TraceNotice recovery check

on:
  push:
    branches: [recovery-check-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Build static export
        run: bun run build
      - name: Validate exported revenue and SEO surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          required = [
              "out/index.html", "out/agency/index.html", "out/contact/index.html",
              "out/sample/index.html", "out/scope-check/index.html", "out/checkout/index.html",
              "out/thanks/index.html", "out/article-50-ai-act/index.html",
              "out/article-50-checklist/index.html", "out/ai-chatbot-disclosure/index.html",
              "out/voice-ai-disclosure/index.html", "out/ai-generated-content-labeling/index.html",
              "out/robots.txt", "out/sitemap.xml", "out/llms.txt",
              "out/a66597bac3557804c13365f6119d290f.txt",
          ]
          errors=[]
          for path in required:
              if not Path(path).is_file(): errors.append(f"missing {path}")

          key="a66597bac3557804c13365f6119d290f"
          if Path(f"out/{key}.txt").read_text().strip()!=key: errors.append("IndexNow key file mismatch")

          sitemap=Path("out/sitemap.xml").read_text()
          for route in ["article-50-ai-act","article-50-checklist","ai-chatbot-disclosure","voice-ai-disclosure","ai-generated-content-labeling"]:
              url=f"https://tracenotice.com/{route}/"
              if url not in sitemap: errors.append(f"sitemap missing {url}")

          bundle_text="\n".join(p.read_text(errors="ignore") for p in Path("out").rglob("*") if p.is_file() and p.suffix in {".html",".js",".json"})
          for pid in ["PLB-DGCNMXS725LE","PLB-TTFVYVVFUXK5","PLB-29SWYAFW7TJE"]:
              if pid not in bundle_text: errors.append(f"static bundle missing PayPal id {pid}")

          def robots_content(path):
              html=Path(path).read_text()
              vals=re.findall(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)', html, flags=re.I)
              if not vals:
                  vals=re.findall(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']robots["\']', html, flags=re.I)
              return " | ".join(vals).lower()

          for path in ["out/checkout/index.html","out/thanks/index.html"]:
              r=robots_content(path)
              if "noindex" not in r: errors.append(f"{path} is not noindex")

          for route in ["article-50-ai-act","article-50-checklist","ai-chatbot-disclosure","voice-ai-disclosure","ai-generated-content-labeling"]:
              path=f"out/{route}/index.html"
              r=robots_content(path)
              if "noindex" in r: errors.append(f"{path} unexpectedly noindex")
              html=Path(path).read_text()
              canonical=f'https://tracenotice.com/{route}/'
              if canonical not in html: errors.append(f"{path} missing canonical {canonical}")

          robots=Path("out/robots.txt").read_text().lower()
          if "sitemap: https://tracenotice.com/sitemap.xml" not in robots: errors.append("robots.txt missing sitemap declaration")
          if "disallow: /checkout/" not in robots: errors.append("robots.txt should disallow checkout")
          if "disallow: /thanks/" not in robots: errors.append("robots.txt should disallow thanks")

          if errors:
              print("RECOVERY VALIDATION FAILED:")
              for e in errors: print(" -", e)
              sys.exit(1)
          print("RECOVERY VALIDATION PASS")
          PY

  live-verify:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Hostinger production from an independent network
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://tracenotice.com
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          get200() {
            local url="$1" ua="${2:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36}"
            local out="$tmp/body"
            local code
            code=$(curl -fsS -L --max-time 25 -A "$ua" -H 'Cache-Control: no-cache' -o "$out" -w '%{http_code}' "$url")
            test "$code" = 200
          }

          for path in / /agency/ /contact/ /sample/ /scope-check/ /article-50-ai-act/ /article-50-checklist/ /ai-chatbot-disclosure/ /voice-ai-disclosure/ /ai-generated-content-labeling/ /sitemap.xml /robots.txt /llms.txt /og/tracenotice-og.png; do
            get200 "$BASE$path"
            echo "200 $path"
          done

          KEY=77e6c9fe9d0423181cd20704a78b1c52
          keybody=$(curl -fsS --max-time 20 "$BASE/$KEY.txt" | tr -d '\r\n')
          test "$keybody" = "$KEY"
          echo "IndexNow key live"

          for page in /article-50-ai-act/ /article-50-checklist/ /ai-chatbot-disclosure/ /voice-ai-disclosure/ /ai-generated-content-labeling/; do
            body=$(curl -fsS -L --max-time 25 "$BASE$page")
            ! grep -qi 'noindex' <<<"$body"
            grep -qi "rel=\"canonical\"" <<<"$body"
          done

          for page in '/checkout/?plan=snapshot' /thanks/; do
            body=$(curl -fsS -L --max-time 25 "$BASE$page")
            grep -qi 'noindex' <<<"$body"
          done

          mobile='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          get200 "$BASE/" "$mobile"
          grep -qi 'name="viewport"' "$tmp/body"
          grep -q 'Ship the AI' "$tmp/body"
          echo 'mobile markup pass'

          declare -A bots
          bots[Googlebot]='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          bots[Bingbot]='Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)'
          bots[OAI-SearchBot]='OAI-SearchBot/1.0; +https://openai.com/searchbot'
          for name in Googlebot Bingbot OAI-SearchBot; do
            get200 "$BASE/article-50-ai-act/" "${bots[$name]}"
            grep -qi 'Article 50' "$tmp/body"
            ! grep -qi 'noindex' "$tmp/body"
            echo "$name markup pass"
          done

          headers=$(curl -fsSI --max-time 20 https://www.tracenotice.com/ | tr -d '\r')
          grep -Eq '^HTTP/.* 30[1278]' <<<"$headers"
          grep -Eqi '^location: https://tracenotice.com/?$' <<<"$headers"
          echo 'www redirect pass'

          for payment in PLB-DGCNMXS725LE PLB-TTFVYVVFUXK5 PLB-29SWYAFW7TJE; do
            code=$(curl -sS -L --max-time 25 -o /dev/null -w '%{http_code}' "https://www.paypal.com/ncp/payment/$payment")
            [[ "$code" =~ ^[23] ]]
            echo "PayPal $payment HTTP $code"
          done

          echo 'LIVE PRODUCTION VERIFICATION PASS'
