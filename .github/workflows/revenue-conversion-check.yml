name: TraceNotice production release gate

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Build static export
        run: bun run build
      - name: Validate production revenue, discovery and privacy surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          errors=[]
          required=[
            "out/index.html",
            "out/agency/index.html",
            "out/article-50-ai-act/index.html",
            "out/article-50-checklist/index.html",
            "out/article-50-evidence-pack/index.html",
            "out/ai-chatbot-disclosure/index.html",
            "out/voice-ai-disclosure/index.html",
            "out/ai-generated-content-labeling/index.html",
            "out/scope-check/index.html",
            "out/sample/index.html",
            "out/checkout/index.html",
            "out/thanks/index.html",
            "out/downloads/article-50-evidence-pack-template.md",
            "out/sitemap.xml",
            "out/robots.txt",
            "out/llms.txt",
          ]
          for path in required:
              if not Path(path).is_file():
                  errors.append(f"missing {path}")

          sitemap=Path("out/sitemap.xml").read_text(errors="ignore")
          canonical_urls=re.findall(r"<loc>(https://tracenotice\.com/[^<]*)</loc>", sitemap)
          if len(canonical_urls) != 16:
              errors.append(f"expected 16 canonical sitemap URLs, found {len(canonical_urls)}")
          if len(canonical_urls) != len(set(canonical_urls)):
              errors.append("duplicate canonical URL in sitemap")
          if "https://tracenotice.com/article-50-evidence-pack/" not in canonical_urls:
              errors.append("sitemap missing evidence pack")

          public_pages=[
            "article-50-ai-act",
            "article-50-checklist",
            "article-50-evidence-pack",
            "ai-chatbot-disclosure",
            "voice-ai-disclosure",
            "ai-generated-content-labeling",
          ]
          for route in public_pages:
              path=Path(f"out/{route}/index.html")
              html=path.read_text(errors="ignore")
              canonical=f"https://tracenotice.com/{route}/"
              if canonical not in html:
                  errors.append(f"{route} missing canonical")
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', html, flags=re.I):
                  errors.append(f"{route} unexpectedly noindex")

          for path in ["out/checkout/index.html", "out/thanks/index.html"]:
              html=Path(path).read_text(errors="ignore").lower()
              if "noindex" not in html:
                  errors.append(f"{path} missing noindex")

          robots=Path("out/robots.txt").read_text(errors="ignore").lower()
          if "sitemap: https://tracenotice.com/sitemap.xml" not in robots:
              errors.append("robots.txt missing sitemap declaration")
          if "disallow: /checkout/" not in robots or "disallow: /thanks/" not in robots:
              errors.append("robots.txt does not protect checkout/thanks")

          llms=Path("out/llms.txt").read_text(errors="ignore")
          for marker in ["article-50-evidence-pack", "scope-check", "checkout/?plan=snapshot"]:
              if marker not in llms:
                  errors.append(f"llms.txt missing {marker}")

          bundle="\n".join(
              p.read_text(errors="ignore")
              for p in Path("out").rglob("*")
              if p.is_file() and p.suffix in {".html", ".js", ".json"}
          )
          for pid in ["PLB-DGCNMXS725LE","PLB-TTFVYVVFUXK5","PLB-29SWYAFW7TJE"]:
              if pid not in bundle:
                  errors.append(f"static bundle missing PayPal id {pid}")
          for marker in [
              "Free 2-minute scope check",
              "Request free one-surface mini-scan",
              "Free mini-scan first",
              "Build release evidence that shows what actually shipped",
          ]:
              if marker not in bundle:
                  errors.append(f"static bundle missing conversion marker: {marker}")

          if errors:
              print("TRACE NOTICE PRODUCTION GATE FAILED")
              for e in errors:
                  print(" -", e)
              sys.exit(1)
          print("TRACE NOTICE PRODUCTION GATE PASS")
          PY
